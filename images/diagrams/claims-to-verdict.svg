<svg viewBox="0 0 340 422" xmlns="http://www.w3.org/2000/svg" role="img"
   aria-label="How the claims become one verdict. The rule is read in order. If any claim is disproven, the verdict is Failed, exit 1. If not, and any claim is not proven, the verdict is Incomplete, exit 2. Otherwise the verdict is Verified, exit 0. Below, a note: a pack built in the Sandbox that verifies exits 3. Sandbox is a label on the result, not a verdict.">
<style>
  .lbl  { font-family:"Geist",sans-serif; font-size:13px; font-weight:500; fill:#16181D; }
  .sub  { font-family:"Geist Mono",monospace; font-size:11px; letter-spacing:.02em; fill:#5D636B; }
  .zone { font-family:"Geist Mono",monospace; font-size:11px; letter-spacing:.08em; fill:#8A9098; }
  .step { font-family:"Geist Mono",monospace; font-size:11px; letter-spacing:.04em; fill:#2C2E6B; }
  .acc  { font-family:"Geist",sans-serif; font-size:13px; font-weight:500; fill:#2C2E6B; }
</style>
<rect x="0" y="0" width="340" height="422" fill="#FFFFFF"/>
<rect x="10" y="10" width="150" height="294" fill="none" stroke="#D8D8D2" stroke-width="1"/>
<text class="zone" x="22" y="29" text-anchor="start">THE RULE</text>
<text class="step" x="22" y="62" text-anchor="start">1</text>
<text class="lbl" x="38" y="62" text-anchor="start">Any claim</text>
<text class="lbl" x="38" y="77" text-anchor="start">disproven?</text>
<text class="step" x="22" y="152" text-anchor="start">2</text>
<text class="lbl" x="38" y="152" text-anchor="start">Any claim</text>
<text class="lbl" x="38" y="167" text-anchor="start">not proven?</text>
<text class="step" x="22" y="242" text-anchor="start">3</text>
<text class="lbl" x="38" y="242" text-anchor="start">Otherwise</text>
<polyline points="60,88 60.0,131.0" fill="none" stroke="#16181D" stroke-width="1" stroke-dasharray="3 3"/>
<polygon points="60,136 57.0,130.0 63.0,130.0" fill="#16181D"/>
<text class="sub" x="68" y="114" text-anchor="start">no</text>
<polyline points="60,178 60.0,219.0" fill="none" stroke="#16181D" stroke-width="1" stroke-dasharray="3 3"/>
<polygon points="60,224 57.0,218.0 63.0,218.0" fill="#16181D"/>
<text class="sub" x="68" y="205" text-anchor="start">no</text>
<rect x="190" y="10" width="140" height="294" fill="none" stroke="#D8D8D2" stroke-width="1"/>
<text class="zone" x="202" y="29" text-anchor="start">THREE VERDICTS</text>
<text class="lbl" x="202" y="62" text-anchor="start">Failed</text>
<text class="sub" x="202" y="77" text-anchor="start">exit 1</text>
<text class="sub" x="202" y="91" text-anchor="start">a claim is</text>
<text class="sub" x="202" y="105" text-anchor="start">disproven</text>
<text class="lbl" x="202" y="152" text-anchor="start">Incomplete</text>
<text class="sub" x="202" y="167" text-anchor="start">exit 2</text>
<text class="sub" x="202" y="181" text-anchor="start">none disproven,</text>
<text class="sub" x="202" y="195" text-anchor="start">some not proven</text>
<rect x="198" y="216" width="124" height="76" fill="none" stroke="#2C2E6B" stroke-width="1"/>
<text class="acc" x="208" y="238" text-anchor="start">Verified</text>
<text class="sub" x="208" y="253" text-anchor="start">exit 0</text>
<text class="sub" x="208" y="267" text-anchor="start">every claim in</text>
<text class="sub" x="208" y="281" text-anchor="start">scope proven</text>
<polyline points="160,66 185.0,66.0" fill="none" stroke="#16181D" stroke-width="1"/>
<polygon points="190,66 184.0,69.0 184.0,63.0" fill="#16181D"/>
<text class="sub" x="175" y="58" text-anchor="middle">yes</text>
<polyline points="160,156 185.0,156.0" fill="none" stroke="#16181D" stroke-width="1"/>
<polygon points="190,156 184.0,159.0 184.0,153.0" fill="#16181D"/>
<text class="sub" x="175" y="148" text-anchor="middle">yes</text>
<polyline points="160,254 185.0,254.0" fill="none" stroke="#16181D" stroke-width="1"/>
<polygon points="190,254 184.0,257.0 184.0,251.0" fill="#16181D"/>
<rect x="10" y="326" width="320" height="86" fill="none" stroke="#D8D8D2" stroke-width="1"/>
<text class="zone" x="22" y="345" text-anchor="start">SANDBOX</text>
<text class="sub" x="24" y="372" text-anchor="start">Sandbox evidence that verifies exits 3.</text>
<text class="sub" x="24" y="386" text-anchor="start">Sandbox is a label on the result,</text>
<text class="sub" x="24" y="400" text-anchor="start">never a verdict or a claim.</text>
</svg>
