<svg viewBox="0 0 840 400" xmlns="http://www.w3.org/2000/svg" role="img"
   aria-label="How Sanning works. Your agent and its adapter capture each step. The content goes to your own log store. Only signed hashes go to Sanning, which seals the records into a stamp on the public record at each interval. You build the evidence pack from Sanning's records and stamp proofs and your own content, and hand it to the reviewer. The reviewer verifies it on their own machine and checks the stamps on the public record, and does not need Sanning.">
<style>
  .lbl  { font-family:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; font-size:12px; font-weight:500; fill:#F5F5F2; }
  .sub  { font-family:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:9px; letter-spacing:.03em; fill:#A3A9B1; }
  .zone { font-family:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:8.6px; letter-spacing:.13em; fill:#8A9098; }
  .step { font-family:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:9px; letter-spacing:.07em; fill:#7D8CFF; }
  .acc  { font-family:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; font-size:12px; font-weight:500; fill:#7D8CFF; }
</style>
<rect x="0" y="0" width="840" height="400" fill="#0E1118"/>
<rect x="10" y="10" width="230" height="380" fill="none" stroke="#262B36" stroke-width="1"/>
<text class="zone" x="20" y="26" text-anchor="start">YOUR SYSTEMS</text>
<rect x="24" y="34" width="202" height="58" fill="none" stroke="#262B36" stroke-width="1"/>
<text class="step" x="36" y="58" text-anchor="start">1</text>
<text class="lbl" x="50" y="58" text-anchor="start">Your agent + adapter</text>
<text class="sub" x="50" y="70" text-anchor="start">captures each step</text>
<rect x="24" y="150" width="202" height="58" fill="none" stroke="#262B36" stroke-width="1"/>
<text class="lbl" x="36" y="176" text-anchor="start">Your log store</text>
<text class="sub" x="36" y="188" text-anchor="start">your content, kept by you</text>
<rect x="24" y="290" width="202" height="84" fill="none" stroke="#262B36" stroke-width="1"/>
<text class="lbl" x="36" y="316" text-anchor="start">Evidence pack</text>
<text class="sub" x="36" y="328" text-anchor="start">Sanning's records and stamp</text>
<text class="sub" x="36" y="339" text-anchor="start">proofs, plus your content</text>
<polyline points="125,92 125.0,145.0" fill="none" stroke="#F5F5F2" stroke-width="1"/>
<polygon points="125,150 122.0,144.0 128.0,144.0" fill="#F5F5F2"/>
<text class="sub" x="133" y="125" text-anchor="start">content</text>
<polyline points="125,208 125.0,285.0" fill="none" stroke="#F5F5F2" stroke-width="1"/>
<polygon points="125,290 122.0,284.0 128.0,284.0" fill="#F5F5F2"/>
<text class="sub" x="133" y="252" text-anchor="start">your content</text>
<rect x="340" y="10" width="190" height="96" fill="none" stroke="#262B36" stroke-width="1"/>
<text class="zone" x="350" y="26" text-anchor="start">SANNING</text>
<text class="lbl" x="354" y="58" text-anchor="start">Receives the records</text>
<text class="sub" x="354" y="70" text-anchor="start">seals them into a stamp</text>
<polyline points="240,58 335.0,58.0" fill="none" stroke="#7D8CFF" stroke-width="1"/>
<polygon points="340,58 334.0,61.0 334.0,55.0" fill="#7D8CFF"/>
<text class="step" x="290" y="48" text-anchor="middle">2  Sign</text>
<text class="step" x="290" y="78" text-anchor="middle">signed hashes,</text>
<text class="step" x="290" y="89" text-anchor="middle">no content</text>
<rect x="630" y="10" width="200" height="96" fill="none" stroke="#262B36" stroke-width="1"/>
<text class="zone" x="640" y="26" text-anchor="start">PUBLIC RECORD</text>
<rect x="644" y="36" width="172" height="52" fill="none" stroke="#7D8CFF" stroke-width="1"/>
<text class="acc" x="656" y="58" text-anchor="start">The stamp</text>
<text class="sub" x="656" y="70" text-anchor="start">shows when the records</text>
<text class="sub" x="656" y="81" text-anchor="start">existed</text>
<polyline points="530,58 625.0,58.0" fill="none" stroke="#F5F5F2" stroke-width="1"/>
<polygon points="630,58 624.0,61.0 624.0,55.0" fill="#F5F5F2"/>
<text class="step" x="580" y="48" text-anchor="middle">3  Anchor</text>
<text class="sub" x="580" y="78" text-anchor="middle">one stamp</text>
<text class="sub" x="580" y="89" text-anchor="middle">per interval</text>
<polyline points="350,106 350,310 231.0,310.0" fill="none" stroke="#F5F5F2" stroke-width="1"/>
<polygon points="226,310 232.0,307.0 232.0,313.0" fill="#F5F5F2"/>
<text class="sub" x="358" y="200" text-anchor="start">records and</text>
<text class="sub" x="358" y="211" text-anchor="start">stamp proofs</text>
<rect x="400" y="290" width="240" height="100" fill="none" stroke="#262B36" stroke-width="1"/>
<text class="zone" x="410" y="306" text-anchor="start">THE REVIEWER</text>
<text class="step" x="414" y="336" text-anchor="start">4</text>
<text class="lbl" x="428" y="336" text-anchor="start">Verifies</text>
<text class="sub" x="428" y="348" text-anchor="start">on their own machine</text>
<polyline points="226,352 395.0,352.0" fill="none" stroke="#F5F5F2" stroke-width="1"/>
<polygon points="400,352 394.0,355.0 394.0,349.0" fill="#F5F5F2"/>
<text class="sub" x="313" y="344" text-anchor="middle">hands over</text>
<polyline points="640,352 730,352 730.0,111.0" fill="none" stroke="#F5F5F2" stroke-width="1" stroke-dasharray="3 3"/>
<polygon points="730,106 733.0,112.0 727.0,112.0" fill="#F5F5F2"/>
<text class="sub" x="738" y="240" text-anchor="start">checks the</text>
<text class="sub" x="738" y="251" text-anchor="start">stamp</text>
<line fill="none" x1="470" y1="106" x2="470" y2="190" stroke="#8A9098" stroke-width="1" stroke-dasharray="3 3"/>
<line fill="none" x1="470" y1="210" x2="470" y2="290" stroke="#8A9098" stroke-width="1" stroke-dasharray="3 3"/>
<circle cx="470" cy="200" r="9" fill="#0E1118" stroke="#F5F5F2" stroke-width="1"/>
<line fill="none" x1="466" y1="196" x2="474" y2="204" stroke="#F5F5F2" stroke-width="1"/>
<line fill="none" x1="474" y1="196" x2="466" y2="204" stroke="#F5F5F2" stroke-width="1"/>
<text class="sub" x="486" y="203" text-anchor="start">not needed to verify</text>
</svg>
