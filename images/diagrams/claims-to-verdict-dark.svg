<svg viewBox="0 0 760 404" xmlns="http://www.w3.org/2000/svg" role="img"
   aria-label="How six claims become one verdict. On the left are the six claims the kernel checks: signed, unchanged, witnessed, complete, agreed and follows the rules. Each claim is proven, disproven or not proven. In the middle is the rule, read in order. If any claim is disproven, the verdict is Failed. If not, and any claim is not proven, the verdict is Incomplete. Otherwise the verdict is Verified. On the right are the three verdicts and their exit codes: Failed exits 1, Incomplete exits 2 and Verified exits 0. Below, a note: a pack built in the Sandbox that verifies exits 3. Sandbox is a label on the result, not a verdict.">
<style>
  .lbl  { font-family:"Geist",sans-serif; font-size:12px; font-weight:500; fill:#F5F5F2; }
  .sub  { font-family:"Geist Mono",monospace; font-size:9px; letter-spacing:.03em; fill:#A3A9B1; }
  .zone { font-family:"Geist Mono",monospace; font-size:8.6px; letter-spacing:.13em; fill:#8A9098; }
  .step { font-family:"Geist Mono",monospace; font-size:9px; letter-spacing:.07em; fill:#7D8CFF; }
  .acc  { font-family:"Geist",sans-serif; font-size:12px; font-weight:500; fill:#7D8CFF; }
</style>
<rect x="0" y="0" width="760" height="404" fill="#0E1118"/>
<rect x="10" y="10" width="230" height="318" fill="none" stroke="#262B36" stroke-width="1"/>
<text class="zone" x="20" y="26" text-anchor="start">SIX CLAIMS</text>
<text class="lbl" x="24" y="54" text-anchor="start">Signed</text>
<text class="sub" x="24" y="66" text-anchor="start">the named key signed it</text>
<text class="lbl" x="24" y="96" text-anchor="start">Unchanged</text>
<text class="sub" x="24" y="108" text-anchor="start">bytes match what was signed</text>
<text class="lbl" x="24" y="138" text-anchor="start">Witnessed</text>
<text class="sub" x="24" y="150" text-anchor="start">a stamp covers it and verifies</text>
<text class="lbl" x="24" y="180" text-anchor="start">Complete</text>
<text class="sub" x="24" y="192" text-anchor="start">the pack holds all it declares</text>
<text class="lbl" x="24" y="222" text-anchor="start">Agreed</text>
<text class="sub" x="24" y="234" text-anchor="start">both sides of a hand-off agree</text>
<text class="lbl" x="24" y="264" text-anchor="start">Follows the rules</text>
<text class="sub" x="24" y="276" text-anchor="start">follows the vocabulary it names</text>
<text class="sub" x="24" y="312" text-anchor="start">each: proven, disproven, not proven</text>
<rect x="284" y="10" width="200" height="318" fill="none" stroke="#262B36" stroke-width="1"/>
<text class="zone" x="294" y="26" text-anchor="start">THE RULE</text>
<text class="step" x="298" y="90" text-anchor="start">1</text>
<text class="lbl" x="312" y="90" text-anchor="start">Any claim disproven?</text>
<text class="step" x="298" y="180" text-anchor="start">2</text>
<text class="lbl" x="312" y="180" text-anchor="start">Any claim not proven?</text>
<text class="step" x="298" y="270" text-anchor="start">3</text>
<text class="lbl" x="312" y="270" text-anchor="start">Otherwise</text>
<polyline points="466,104 466.0,159.0" fill="none" stroke="#F5F5F2" stroke-width="1" stroke-dasharray="3 3"/>
<polygon points="466,164 463.0,158.0 469.0,158.0" fill="#F5F5F2"/>
<text class="sub" x="474" y="138" text-anchor="start">no</text>
<polyline points="466,194 466.0,249.0" fill="none" stroke="#F5F5F2" stroke-width="1" stroke-dasharray="3 3"/>
<polygon points="466,254 463.0,248.0 469.0,248.0" fill="#F5F5F2"/>
<text class="sub" x="474" y="228" text-anchor="start">no</text>
<rect x="528" y="10" width="222" height="318" fill="none" stroke="#262B36" stroke-width="1"/>
<text class="zone" x="538" y="26" text-anchor="start">THREE VERDICTS</text>
<text class="lbl" x="542" y="90" text-anchor="start">Failed</text>
<text class="sub" x="542" y="102" text-anchor="start">exit 1</text>
<text class="sub" x="542" y="113" text-anchor="start">a claim is disproven</text>
<text class="lbl" x="542" y="180" text-anchor="start">Incomplete</text>
<text class="sub" x="542" y="192" text-anchor="start">exit 2</text>
<text class="sub" x="542" y="203" text-anchor="start">none disproven, some not proven</text>
<rect x="536" y="242" width="206" height="56" fill="none" stroke="#7D8CFF" stroke-width="1"/>
<text class="acc" x="542" y="270" text-anchor="start">Verified</text>
<text class="sub" x="542" y="282" text-anchor="start">exit 0</text>
<text class="sub" x="542" y="293" text-anchor="start">every claim in scope proven</text>
<polyline points="240,169 279.0,169.0" fill="none" stroke="#F5F5F2" stroke-width="1"/>
<polygon points="284,169 278.0,172.0 278.0,166.0" fill="#F5F5F2"/>
<polyline points="484,86 523.0,86.0" fill="none" stroke="#F5F5F2" stroke-width="1"/>
<polygon points="528,86 522.0,89.0 522.0,83.0" fill="#F5F5F2"/>
<text class="sub" x="506" y="80" text-anchor="middle">yes</text>
<polyline points="484,176 523.0,176.0" fill="none" stroke="#F5F5F2" stroke-width="1"/>
<polygon points="528,176 522.0,179.0 522.0,173.0" fill="#F5F5F2"/>
<text class="sub" x="506" y="170" text-anchor="middle">yes</text>
<polyline points="484,266 523.0,266.0" fill="none" stroke="#F5F5F2" stroke-width="1"/>
<polygon points="528,266 522.0,269.0 522.0,263.0" fill="#F5F5F2"/>
<rect x="10" y="340" width="740" height="54" fill="none" stroke="#262B36" stroke-width="1"/>
<text class="zone" x="20" y="356" text-anchor="start">SANDBOX</text>
<text class="sub" x="24" y="372" text-anchor="start">Sandbox evidence that verifies exits 3. Sandbox is a label on the result, never a verdict or a claim.</text>
</svg>
